name: Portable workflow
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser_tests:
        description: Install Chromium and run optional browser tests
        type: boolean
        default: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: github.event_name == 'workflow_dispatch' && inputs.browser_tests
      - run: python scripts/project.py build
      - run: npm test
        env:
          PYTHON: python
          PYTHONUTF8: '1'
          SKIP_BROWSER_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_tests && '0' || '1' }}
